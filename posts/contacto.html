<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — El Balance</title>
  <meta name="description" content="Cómo ponerte en contacto con El Balance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FBEEE6;
      --card: #FFF8F2;
      --ink: #211A16;
      --ink-soft: #5B4E45;
      --green: #2F5233;
      --green-deep: #1F3A23;
      --copper: #A8763E;
      --line: #D9C4B3;
      --font-display: 'Fraunces', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--green-deep);
      outline-offset: 3px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .masthead {
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }

    .masthead .wrap {
      max-width: 1080px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand em {
      font-style: italic;
      color: var(--green);
    }

    .back {
      font-family: var(--font-mono);
      font-size: 12px;
      text-decoration: none;
      color: var(--ink-soft);
    }

    .back:hover {
      color: var(--green);
    }

    article {
      padding: 44px 0 60px;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      margin: 0 0 26px;
    }

    p {
      font-size: 17px;
      line-height: 1.75;
      margin: 0 0 22px;
    }

    .contact-box {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 26px;
      margin-top: 20px;
    }

    .contact-box strong {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--copper);
      display: block;
      margin-bottom: 8px;
    }

    .contact-box a {
      font-family: var(--font-display);
      font-size: 19px;
      color: var(--green-deep);
      text-decoration: none;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 40px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
    }

    footer .wrap {
      max-width: 1080px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer a {
      text-decoration: none;
    }

    footer a:hover {
      color: var(--green);
    }
  </style>
</head>

<body>
  <header class="masthead">
    <div class="wrap"><a href="../index.html" class="brand">El <em>Balance</em></a><a href="../index.html"
        class="back">← Volver a portada</a></div>
  </header>
  <main class="wrap">
    <article>
      <h1>Contacto</h1>
      <p>Si quieres proponer un tema, señalar un error en alguna entrada, o simplemente saludar, puedes escribirnos por
        correo.</p>
      <div class="contact-box">
        <strong>Correo electrónico</strong>
        <a href="mailto:rubenmartindelopez@gmail.com">rubenmartindelopez@gmail.com</a>
      </div>
    </article>
  </main>
  <footer>
    <div class="wrap"><span>© 2026 El Balance. Contenido con fines informativos, no es asesoramiento
        financiero.</span><span><a href="../index.html">Portada</a></span></div>
  </footer>
</body>

</html>
